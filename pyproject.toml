[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "linux-mcp-agent-server"
version = "0.1.0"
description = "Read-only Linux observability MCP server for Agentic AI clients"
readme = "README.md"
requires-python = ">=3.14,<3.16"
license = "MIT"
authors = [{ name = "Linux MCP Agent Server Team" }]
keywords = ["mcp", "linux", "agentic-ai", "observability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "mcp==2.3.0",
  "psutil==7.2.2",
  "pydantic==2.14.2",
  "starlette==1.10.0",
  "uvicorn==0.54.0",
]

[project.scripts]
linux-mcp-agent = "linux_mcp_agent.__main__:main"

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1",
  "pyright==1.1.414",
  "ruff==0.17.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/linux_mcp_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false

[tool.uv]
package = true

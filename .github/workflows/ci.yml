name: CI

on:
  push:
    branches: [main, team-handoff]
  pull_request:
    branches: [main, team-handoff]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }} quality and tests
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14.10", "3.15.2"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==0.13.6"

      - name: Select the matrix interpreter for uv
        run: uv python pin "${{ matrix.python-version }}"

      - name: Resolve and install exact direct dependencies
        run: |
          uv lock
          uv sync --all-groups

      - name: Ruff
        run: uv run ruff check .

      - name: Pyright
        run: uv run pyright

      - name: Pytest
        run: uv run pytest

      - name: Export resolved dependency lock
        if: matrix.python-version == '3.15.2'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: uv-lock-python-3.15.2
          path: uv.lock
          if-no-files-found: error
          retention-days: 1

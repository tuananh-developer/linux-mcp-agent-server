name: CI

on:
  push:
    branches: [main, team-handoff]
  pull_request:
    branches: [main, team-handoff]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck and unit test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14.10", "3.15.2"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install uv 0.13.6
        uses: astral-sh/setup-uv@v9.3.0
        with:
          version: "0.13.6"
          enable-cache: false

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Resolve and sync exact direct dependencies
        run: |
          uv lock
          uv sync --python ${{ matrix.python-version }} --all-groups

      - name: Export resolved lockfile for auditability
        if: matrix.python-version == '3.15.2'
        run: test -s uv.lock

      - name: Ruff lint
        run: uv run --python ${{ matrix.python-version }} ruff check .

      - name: Pyright strict typecheck
        run: uv run --python ${{ matrix.python-version }} pyright

      - name: Pytest unit tests
        run: uv run --python ${{ matrix.python-version }} pytest

      - name: Upload resolved uv.lock artifact
        if: matrix.python-version == '3.15.2'
        uses: actions/upload-artifact@v8.0.1
        with:
          name: resolved-uv-lock-py3152
          path: uv.lock
          if-no-files-found: error
          retention-days: 1

  compose-config:
    name: Validate infrastructure Compose file
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Validate Compose model
        working-directory: deploy/compose
        run: docker compose --env-file .env.example -f compose.yaml config --quiet

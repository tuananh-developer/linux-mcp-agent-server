name: CI

on:
  push:
    branches: [main, team-handoff]
  pull_request:
    branches: [main, team-handoff]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck and unit test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.15"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install uv 0.13.8
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          enable-cache: false

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync committed lockfile
        run: |
          uv sync --python ${{ matrix.python-version }} --all-groups --locked

      - name: Export resolved lockfile for auditability
        if: matrix.python-version == '3.15'
        run: test -s uv.lock

      - name: Ruff lint
        run: uv run --locked --python ${{ matrix.python-version }} ruff check .

      - name: Pyright strict typecheck
        run: uv run --locked --python ${{ matrix.python-version }} pyright

      - name: Pytest unit tests
        run: uv run --locked --python ${{ matrix.python-version }} pytest

      - name: Dashboard MCP transport tests
        run: node --test tests/dashboard_transport.test.mjs tests/agent_loop.test.mjs

      - name: Upload resolved uv.lock artifact
        if: matrix.python-version == '3.15'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: resolved-uv-lock-py315
          path: uv.lock
          if-no-files-found: error
          retention-days: 1

  compose-config:
    name: Validate infrastructure Compose file
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Validate Compose model
        working-directory: deploy/compose
        run: docker compose --env-file .env.example -f compose.yaml config --quiet

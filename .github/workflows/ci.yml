name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }} quality and tests
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14.10", "3.15.2"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==0.13.6"

      - name: Select the matrix interpreter for uv
        run: uv python pin "${{ matrix.python-version }}"

      - name: Resolve and install exact direct dependencies
        run: |
          uv lock
          uv sync --all-groups

      - name: Ruff autofix preview
        run: uv run ruff check --diff . || true

      - name: Ruff
        run: uv run ruff check .

      - name: Pyright
        run: uv run pyright

      - name: Pytest
        run: uv run pytest

  compose-config:
    name: Validate infrastructure Compose file
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Validate Compose model
        working-directory: deploy/compose
        run: docker compose --env-file .env.example -f compose.yaml config --quiet

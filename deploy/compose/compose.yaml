name: linux-mcp-agent-infrastructure

services:
  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - keycloak-postgres:/var/lib/postgresql/data
    networks:
      - identity-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command:
      - start
      - --http-enabled=true
      - --proxy-headers=xforwarded
      - --hostname=https://${AUTH_DOMAIN:?Set AUTH_DOMAIN}
      - --health-enabled=true
      - --metrics-enabled=true
      - --features=resource-indicators
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: ${POSTGRES_DB:?Set POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?Set KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME_STRICT: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_FEATURES: resource-indicators
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - identity-backend
    security_opt:
      - no-new-privileges:true

  caddy:
    profiles: ["lan"]
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      MCP_DOMAIN: ${MCP_DOMAIN:?Set MCP_DOMAIN}
      AUTH_DOMAIN: ${AUTH_DOMAIN:?Set AUTH_DOMAIN}
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    depends_on:
      - keycloak

networks:
  identity-backend:
    internal: true

volumes:
  keycloak-postgres:
  caddy-data:
  caddy-config:
